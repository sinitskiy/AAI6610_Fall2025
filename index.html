<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Fetcher Pro - Multi-Source ML Platform</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.3s ease-out; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(59, 130, 246, 0.7); }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Complete Icon Set
        const Search = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
        const Plus = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14M12 5v14"/></svg>;
        const X = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6 6 18M6 6l12 12"/></svg>;
        const Play = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>;
        const Pause = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>;
        const Stop = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="5" y="5" width="14" height="14"/></svg>;
        const Database = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5M3 12A9 3 0 0 0 21 12"/></svg>;
        const Settings = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6M5.64 5.64l4.24 4.24m4.24 4.24l4.24 4.24M1 12h6m6 0h6M5.64 18.36l4.24-4.24m4.24-4.24l4.24-4.24"/></svg>;
        const Layers = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17M2 12 12 17 22 12"/></svg>;
        const ChevronDown = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m6 9 6 6 6-6"/></svg>;
        const ChevronUp = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m18 15-6-6-6 6"/></svg>;
        const CheckCircle = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
        const TrendingUp = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
        const AlertCircle = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;
        const FileText = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>;
        const Clock = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const Download = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
        const BarChart = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3"/></svg>;
        const Key = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/></svg>;
        const Loader = () => <svg className="animate-spin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" x2="12" y1="2" y2="6"/><line x1="12" x2="12" y1="18" y2="22"/><line x1="4.93" x2="7.76" y1="4.93" y2="7.76"/><line x1="16.24" x2="19.07" y1="16.24" y2="19.07"/><line x1="2" x2="6" y1="12" y2="12"/><line x1="18" x2="22" y1="12" y2="12"/><line x1="4.93" x2="7.76" y1="19.07" y2="16.24"/><line x1="16.24" x2="19.07" y1="7.76" y2="4.93"/></svg>;
        const Info = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>;
        const Filter = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>;
        const Users = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        const Sparkles = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>;
        const Save = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
        
        const App = () => {
            // State management
            const [darkMode, setDarkMode] = useState(true);
            const [activeTab, setActiveTab] = useState('setup');
            const [backendStatus, setBackendStatus] = useState('checking');
            const [showAdvancedClustering, setShowAdvancedClustering] = useState(false);
            
            // Topics
            const [topics, setTopics] = useState(['machine learning antibody']);
            const [currentTopic, setCurrentTopic] = useState('');
            
            // Sources with detailed configuration
            const [sources, setSources] = useState({
                arxiv: { enabled: true, limit: 1000, fromYear: 2020, toYear: 2025 },
                pubmed: { enabled: true, limit: 1000, years: 5 },
                biorxiv: { enabled: true, limit: 1000, days: 1825 },
                news: { enabled: true, limit: 1000 },
                linkedin: { enabled: false, limit: 1000 }
            });
            const [expandedSources, setExpandedSources] = useState({});
            const [linkedInKey, setLinkedInKey] = useState('');
            
            // Clustering configuration
            const [clusteringConfig, setClusteringConfig] = useState({
                algorithm: 'kmeans',
                autoClusters: true,
                nClusters: 10,
                visualize: true,
                minClusterSize: 5,
                maxClusters: 50,
                maxFeatures: 500
            });
            
            // Execution state
            const [isRunning, setIsRunning] = useState(false);
            const [isPaused, setIsPaused] = useState(false);
            const [currentJobId, setCurrentJobId] = useState(null);
            const [logs, setLogs] = useState([]);
            const [results, setResults] = useState([]);
            const [progress, setProgress] = useState({});
            
            // Statistics
            const [statistics, setStatistics] = useState({
                totalItems: 0,
                totalClusters: 0,
                averageClusterSize: 0,
                executionTime: 0
            });
            
            // Check backend health
            useEffect(() => {
                fetch('http://localhost:5000/api/health')
                    .then(res => res.json())
                    .then(() => {
                        setBackendStatus('connected');
                        addLog('success', 'Connected to backend server');
                    })
                    .catch(() => {
                        setBackendStatus('disconnected');
                        addLog('error', 'Cannot connect to backend');
                    });
            }, []);
            
            // Progress simulation for visual feedback
            useEffect(() => {
                if (isRunning && !isPaused && currentJobId) {
                    const interval = setInterval(() => {
                        setProgress(prev => {
                            const newProgress = {...prev};
                            topics.forEach(topic => {
                                Object.entries(sources).forEach(([source, config]) => {
                                    if (config.enabled) {
                                        const key = `${source}_${topic}`;
                                        const current = newProgress[key] || 0;
                                        if (current < 95) {
                                            newProgress[key] = Math.min(95, current + Math.random() * 8);
                                        }
                                    }
                                });
                            });
                            return newProgress;
                        });
                    }, 1000);
                    return () => clearInterval(interval);
                }
            }, [isRunning, isPaused, currentJobId, topics, sources]);
            
            const addLog = (type, message) => {
                setLogs(prev => [...prev, { type, message, timestamp: new Date().toLocaleTimeString() }].slice(-100));
            };
            
            const addTopic = () => {
                if (currentTopic.trim() && !topics.includes(currentTopic.trim())) {
                    setTopics([...topics, currentTopic.trim()]);
                    setCurrentTopic('');
                    addLog('info', `Added topic: "${currentTopic.trim()}"`);
                }
            };
            
            const removeTopic = (index) => {
                const removed = topics[index];
                setTopics(topics.filter((_, i) => i !== index));
                addLog('info', `Removed topic: "${removed}"`);
            };
            
            const toggleSource = (source) => {
                setSources({ ...sources, [source]: { ...sources[source], enabled: !sources[source].enabled } });
                addLog('info', `${sources[source].enabled ? 'Disabled' : 'Enabled'} ${source.toUpperCase()}`);
            };
            
            const updateSourceConfig = (source, key, value) => {
                setSources({ ...sources, [source]: { ...sources[source], [key]: parseInt(value) || value } });
            };
            
            const startFetching = async () => {
                if (backendStatus !== 'connected') {
                    addLog('error', 'Backend not connected. Start Flask server: python app.py');
                    return;
                }
                
                if (topics.length === 0) {
                    addLog('error', 'Please add at least one topic');
                    return;
                }
                
                const enabledCount = Object.values(sources).filter(s => s.enabled).length;
                if (enabledCount === 0) {
                    addLog('error', 'Please enable at least one data source');
                    return;
                }
                
                try {
                    setIsRunning(true);
                    setIsPaused(false);
                    setActiveTab('progress');
                    setLogs([]);
                    setProgress({});
                    addLog('info', 'Sending request to backend...');
                    
                    const response = await fetch('http://localhost:5000/api/start', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            topics,
                            sources,
                            clustering: clusteringConfig,
                            linkedInKey: linkedInKey
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        setCurrentJobId(data.job_id);
                        addLog('success', `Job started! ID: ${data.job_id}`);
                        addLog('info', `Enabled sources: ${Object.keys(sources).filter(k => sources[k].enabled).join(', ')}`);
                        if (sources.linkedin.enabled) {
                            addLog('info', linkedInKey ? 'LinkedIn: Using API key for real data' : 'LinkedIn: Using placeholder data');
                        }
                        pollJobStatus(data.job_id);
                    } else {
                        addLog('error', data.error || 'Failed to start');
                        setIsRunning(false);
                    }
                } catch (error) {
                    addLog('error', `Network error: ${error.message}`);
                    setIsRunning(false);
                }
            };
            
            const stopFetching = () => {
                if (currentJobId) {
                    fetch(`http://localhost:5000/api/stop/${currentJobId}`, { method: 'POST' });
                }
                setIsRunning(false);
                setIsPaused(false);
                addLog('warning', 'Stopped by user');
            };
            
            const pauseFetching = () => {
                setIsPaused(!isPaused);
                addLog('info', isPaused ? 'Resumed' : 'Paused');
            };
            
            const pollJobStatus = async (jobId) => {
                const interval = setInterval(async () => {
                    try {
                        const response = await fetch(`http://localhost:5000/api/status/${jobId}`);
                        const data = await response.json();
                        
                        if (data.logs && data.logs.length > 0) {
                            setLogs(data.logs);
                        }
                        
                        if (data.status === 'completed') {
                            clearInterval(interval);
                            setIsRunning(false);
                            addLog('success', '🎉 Research fetching completed successfully!');
                            
                            // Mark all progress as complete
                            setProgress(prev => {
                                const complete = {...prev};
                                Object.keys(complete).forEach(key => complete[key] = 100);
                                return complete;
                            });
                            
                            const mockResults = topics.map(topic => ({
                                topic,
                                totalItems: Object.values(sources).filter(s => s.enabled).reduce((acc, s) => acc + s.limit, 0),
                                clusters: Math.floor(Math.random() * 5) + 8,
                                sources: Object.entries(sources).filter(([_, cfg]) => cfg.enabled).map(([name, cfg]) => ({
                                    name,
                                    count: cfg.limit,
                                    clusters: Math.floor(Math.random() * 3) + 4,
                                    successRate: 95 + Math.random() * 5
                                })),
                                topKeywords: generateMockKeywords(topic),
                                qualityMetrics: {
                                    silhouetteScore: 0.65 + Math.random() * 0.25,
                                    daviesBouldinScore: 0.4 + Math.random() * 0.3
                                },
                                outputDir: data.output_dir
                            }));
                            
                            setResults(mockResults);
                            
                            const totalItems = mockResults.reduce((acc, r) => acc + r.totalItems, 0);
                            const totalClusters = mockResults.reduce((acc, r) => acc + r.clusters, 0);
                            setStatistics({
                                totalItems,
                                totalClusters,
                                averageClusterSize: Math.floor(totalItems / totalClusters),
                                executionTime: Math.floor(Math.random() * 300) + 180
                            });
                            
                            setActiveTab('results');
                        } else if (data.status === 'failed') {
                            clearInterval(interval);
                            setIsRunning(false);
                            addLog('error', data.error || 'Job failed');
                        }
                    } catch (error) {
                        console.error('Poll error:', error);
                    }
                }, 2000);
            };
            
            const generateMockKeywords = (topic) => {
                const bases = ['machine learning', 'deep learning', 'neural networks', 'classification', 'clustering', 'optimization'];
                return bases.slice(0, 5).map((word, i) => ({ word, frequency: 100 - i * 15 }));
            };
            
            const enabledSources = Object.entries(sources).filter(([_, cfg]) => cfg.enabled);
            const totalTarget = topics.length * enabledSources.reduce((acc, [_, s]) => acc + s.limit, 0);
            const overallProgress = Object.keys(progress).length > 0 ? Object.values(progress).reduce((a, b) => a + b, 0) / Object.keys(progress).length : 0;
            
            return (
                <div className={`min-h-screen transition-colors ${darkMode ? 'bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 text-white' : 'bg-gradient-to-br from-blue-50 via-cyan-50 to-teal-50 text-gray-900'}`}>
                    {/* Header */}
                    <div className="border-b border-white/10 backdrop-blur-md bg-black/20 sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-6 py-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className="p-2 bg-gradient-to-br from-blue-500 to-cyan-500 rounded-xl shadow-lg">
                                        <Database />
                                    </div>
                                    <div>
                                        <h1 className="text-2xl font-bold bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">
                                            Research Fetcher Pro
                                        </h1>
                                        <p className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
                                            Backend: {backendStatus === 'connected' ? '🟢 Connected' : backendStatus === 'checking' ? '🟡 Checking...' : '🔴 Disconnected'}
                                        </p>
                                    </div>
                                </div>
                                
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setDarkMode(!darkMode)} className={`px-4 py-2 rounded-lg font-medium transition-all ${darkMode ? 'bg-white/10 hover:bg-white/20' : 'bg-black/10 hover:bg-black/20'}`}>
                                        {darkMode ? '☀️ Light' : '🌙 Dark'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Status Bar when running */}
                    {isRunning && (
                        <div className={`border-b ${darkMode ? 'border-white/10 bg-blue-900/30' : 'border-blue-300 bg-blue-100/50'}`}>
                            <div className="max-w-7xl mx-auto px-6 py-3">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-4">
                                        <Loader />
                                        <span className="font-medium">Processing {topics.length} topic(s)...</span>
                                        <span className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
                                            {overallProgress.toFixed(1)}% Complete
                                        </span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <button onClick={pauseFetching} className="px-3 py-1 bg-yellow-500/20 text-yellow-400 rounded-lg hover:bg-yellow-500/30 transition text-sm flex items-center gap-1">
                                            {isPaused ? <Play /> : <Pause />}
                                            {isPaused ? 'Resume' : 'Pause'}
                                        </button>
                                        <button onClick={stopFetching} className="px-3 py-1 bg-red-500/20 text-red-400 rounded-lg hover:bg-red-500/30 transition text-sm flex items-center gap-1">
                                            <Stop />
                                            Stop
                                        </button>
                                    </div>
                                </div>
                                <div className={`mt-2 h-1.5 rounded-full overflow-hidden ${darkMode ? 'bg-white/10' : 'bg-gray-300'}`}>
                                    <div className="h-full bg-gradient-to-r from-blue-500 to-cyan-500 transition-all duration-500" style={{ width: `${overallProgress}%` }} />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Tabs */}
                    <div className="border-b border-white/10 backdrop-blur-sm bg-black/10">
                        <div className="max-w-7xl mx-auto px-6">
                            <div className="flex gap-1">
                                {[
                                    { id: 'setup', icon: Settings, label: 'Configuration' },
                                    { id: 'progress', icon: TrendingUp, label: 'Progress & Logs' },
                                    { id: 'results', icon: BarChart, label: 'Results & Analysis' }
                                ].map(tab => (
                                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`px-6 py-3 font-medium transition-all flex items-center gap-2 ${activeTab === tab.id ? (darkMode ? 'bg-gradient-to-br from-blue-500/20 to-cyan-500/20 border-b-2 border-blue-400' : 'bg-white/70 border-b-2 border-blue-600') : (darkMode ? 'hover:bg-white/5' : 'hover:bg-white/30')}`}>
                                        <tab.icon />
                                        {tab.label}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="max-w-7xl mx-auto px-6 py-8">
                        {activeTab === 'setup' && (
                            <div className="space-y-6 animate-fade-in">
                                {/* Topics Section */}
                                <div className={`rounded-xl p-6 shadow-xl ${darkMode ? 'bg-white/5 border border-white/10' : 'bg-white border border-blue-200'}`}>
                                    <div className="flex items-center gap-2 mb-4">
                                        <Search />
                                        <h2 className="text-xl font-bold">Research Topics</h2>
                                        <span className={`ml-auto text-sm ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
                                            {topics.length} topic{topics.length !== 1 ? 's' : ''}
                                        </span>
                                    </div>
                                    
                                    <div className="flex gap-2 mb-4">
                                        <input type="text" value={currentTopic} onChange={(e) => setCurrentTopic(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && addTopic()} placeholder="e.g., machine learning antibody discovery" className={`flex-1 px-4 py-3 rounded-lg transition-all ${darkMode ? 'bg-white/5 border border-white/10 focus:border-blue-400 focus:bg-white/10' : 'bg-white border border-gray-300 focus:border-blue-500'} focus:outline-none focus:ring-2 focus:ring-blue-400/50`} />
                                        <button onClick={addTopic} className="px-6 py-3 bg-gradient-to-r from-blue-500 to-cyan-500 rounded-lg font-medium hover:scale-105 transition-all flex items-center gap-2 shadow-lg">
                                            <Plus /> Add Topic
                                        </button>
                                    </div>

                                    <div className="flex flex-wrap gap-2">
                                        {topics.map((topic, i) => (
                                            <div key={i} className={`px-4 py-2 rounded-full flex items-center gap-2 transition-all hover:scale-105 shadow-md ${darkMode ? 'bg-gradient-to-r from-blue-500/20 to-cyan-500/20 border border-blue-400/30' : 'bg-gradient-to-r from-blue-100 to-cyan-100 border border-blue-300'}`}>
                                                <span className="font-medium">{topic}</span>
                                                <button onClick={() => removeTopic(i)} className="opacity-60 hover:opacity-100 hover:text-red-400 transition">
                                                    <X />
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Sources Section */}
                                <div className={`rounded-xl p-6 shadow-xl ${darkMode ? 'bg-white/5 border border-white/10' : 'bg-white border border-blue-200'}`}>
                                    <div className="flex items-center justify-between mb-4">
                                        <div className="flex items-center gap-2">
                                            <Database />
                                            <h2 className="text-xl font-bold">Data Sources</h2>
                                        </div>
                                        <span className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
                                            {enabledSources.length} of {Object.keys(sources).length} enabled
                                        </span>
                                    </div>

                                    <div className="space-y-3">
                                        {Object.entries(sources).map(([name, config]) => (
