<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Fetcher Pro</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        .spin { animation: spin 1s linear infinite; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const App = () => {
            const [darkMode, setDarkMode] = useState(true);
            const [status, setStatus] = useState('checking');
            const [activeTab, setActiveTab] = useState('setup');
            const [topics, setTopics] = useState(['machine learning antibody']);
            const [newTopic, setNewTopic] = useState('');
            const [linkedInKey, setLinkedInKey] = useState('');
            const [sources, setSources] = useState({
                arxiv: { enabled: true, limit: 1000 },
                pubmed: { enabled: true, limit: 1000 },
                biorxiv: { enabled: true, limit: 1000 },
                news: { enabled: true, limit: 1000 },
                linkedin: { enabled: false, limit: 1000 }
            });
            const [expanded, setExpanded] = useState({});
            const [algorithm, setAlgorithm] = useState('kmeans');
            const [autoClusters, setAutoClusters] = useState(true);
            const [nClusters, setNClusters] = useState(10);
            const [isRunning, setIsRunning] = useState(false);
            const [jobId, setJobId] = useState(null);
            const [logs, setLogs] = useState([]);
            const [results, setResults] = useState([]);
            
            useEffect(() => {
                fetch('http://localhost:5000/api/health')
                    .then(() => setStatus('connected'))
                    .catch(() => setStatus('disconnected'));
            }, []);
            
            useEffect(() => {
                if (isRunning && jobId) {
                    const interval = setInterval(async () => {
                        try {
                            const res = await fetch(`http://localhost:5000/api/status/${jobId}`);
                            const data = await res.json();
                            if (data.logs) setLogs(data.logs);
                            if (data.status === 'completed') {
                                setIsRunning(false);
                                setResults(topics.map(t => ({ topic: t, items: 2000, clusters: 8 })));
                                setActiveTab('results');
                            }
                        } catch (e) {}
                    }, 2000);
                    return () => clearInterval(interval);
                }
            }, [isRunning, jobId]);
            
            const addTopic = () => {
                if (newTopic.trim() && !topics.includes(newTopic.trim())) {
                    setTopics([...topics, newTopic.trim()]);
                    setNewTopic('');
                }
            };
            
            const removeTopic = (i) => setTopics(topics.filter((_, idx) => idx !== i));
            
            const toggleSource = (s) => setSources({...sources, [s]: {...sources[s], enabled: !sources[s].enabled}});
            
            const startJob = async () => {
                if (status !== 'connected') {
                    alert('Backend not connected!');
                    return;
                }
                try {
                    setIsRunning(true);
                    setActiveTab('progress');
                    const res = await fetch('http://localhost:5000/api/start', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            topics,
                            sources,
                            clustering: {algorithm, autoClusters, nClusters},
                            linkedInKey
                        })
                    });
                    const data = await res.json();
                    setJobId(data.job_id);
                } catch (e) {
                    alert('Error: ' + e.message);
                    setIsRunning(false);
                }
            };
            
            const bg = darkMode ? 'from-slate-900 via-blue-900 to-slate-900' : 'from-blue-50 via-cyan-50 to-teal-50';
            const card = darkMode ? 'bg-white/5 border-white/10' : 'bg-white border-blue-200';
            const text = darkMode ? 'text-white' : 'text-gray-900';
            
            return (
                <div className={`min-h-screen bg-gradient-to-br ${bg} ${text}`}>
                    <div className="border-b border-white/10 bg-black/20 backdrop-blur">
                        <div className="max-w-6xl mx-auto px-6 py-4">
                            <div className="flex items-center justify-between">
                                <div>
                                    <h1 className="text-3xl font-bold bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">
                                        Research Fetcher Pro
                                    </h1>
                                    <p className="text-sm text-gray-400">
                                        Backend: {status === 'connected' ? '🟢 Connected' : '🔴 Disconnected'}
                                    </p>
                                </div>
                                <button onClick={() => setDarkMode(!darkMode)} className="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20">
                                    {darkMode ? '☀️' : '🌙'}
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div className="border-b border-white/10 bg-black/10">
                        <div className="max-w-6xl mx-auto px-6">
                            <div className="flex gap-2">
                                {['setup', 'progress', 'results'].map(tab => (
                                    <button key={tab} onClick={() => setActiveTab(tab)} className={`px-6 py-3 font-medium capitalize ${activeTab === tab ? 'bg-blue-500/20 border-b-2 border-blue-400' : 'hover:bg-white/5'}`}>
                                        {tab}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                    
                    <div className="max-w-6xl mx-auto px-6 py-8">
                        {activeTab === 'setup' && (
                            <div className="space-y-6 fade-in">
                                <div className={`rounded-xl p-6 border ${card}`}>
                                    <h2 className="text-xl font-bold mb-4">Research Topics</h2>
                                    <div className="flex gap-2 mb-4">
                                        <input value={newTopic} onChange={(e) => setNewTopic(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && addTopic()} placeholder="e.g., protein folding" className={`flex-1 px-4 py-3 rounded-lg ${darkMode ? 'bg-white/5 border border-white/10' : 'bg-white border border-gray-300'} focus:outline-none focus:ring-2 focus:ring-blue-400`} />
                                        <button onClick={addTopic} className="px-6 py-3 bg-gradient-to-r from-blue-500 to-cyan-500 rounded-lg font-bold hover:scale-105 transition">
                                            Add
                                        </button>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        {topics.map((t, i) => (
                                            <div key={i} className="px-4 py-2 bg-blue-500/20 border border-blue-400/30 rounded-full flex items-center gap-2">
                                                {t}
                                                <button onClick={() => removeTopic(i)} className="hover:text-red-400">✕</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                
                                <div className={`rounded-xl p-6 border ${card}`}>
                                    <h2 className="text-xl font-bold mb-4">Data Sources</h2>
                                    <div className="space-y-3">
                                        {Object.entries(sources).map(([name, cfg]) => (
                                            <div key={name} className={`p-4 rounded-lg border ${cfg.enabled ? 'bg-blue-500/10 border-blue-400/30' : 'bg-white/5 border-white/10 opacity-60'}`}>
                                                <div className="flex items-center justify-between">
                                                    <div className="flex items-center gap-3">
                                                        <button onClick={() => toggleSource(name)} className={`w-12 h-6 rounded-full ${cfg.enabled ? 'bg-gradient-to-r from-blue-500 to-cyan-500' : 'bg-gray-600'}`}>
                                                            <div className={`w-5 h-5 bg-white rounded-full transition-transform ${cfg.enabled ? 'translate-x-6' : 'translate-x-0.5'}`} />
                                                        </button>
                                                        <div>
                                                            <div className="font-bold capitalize">{name}</div>
                                                            <div className="text-sm text-gray-400">Limit: {cfg.limit}</div>
                                                        </div>
                                                    </div>
                                                    <button onClick={() => setExpanded({...expanded, [name]: !expanded[name]})} className="p-2 hover:bg-white/10 rounded">
                                                        {expanded[name] ? '▲' : '▼'}
                                                    </button>
                                                </div>
                                                {expanded[name] && cfg.enabled && (
                                                    <div className="mt-4 pt-4 border-t border-white/10">
                                                        <label className="block text-sm mb-1">Item Limit</label>
                                                        <input type="number" value={cfg.limit} onChange={(e) => setSources({...sources, [name]: {...cfg, limit: parseInt(e.target.value)}})} className={`w-32 px-3 py-2 rounded ${darkMode ? 'bg-white/10 border border-white/20' : 'bg-white border border-gray-300'}`} />
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    
                                    <div className="mt-4 p-4 bg-yellow-500/10 border border-yellow-500/30 rounded-lg">
                                        <h3 className="font-bold mb-2">🔑 LinkedIn API Key (Optional)</h3>
                                        <p className="text-sm mb-3 opacity-75">Leave blank for placeholder data</p>
                                        <input type="password" value={linkedInKey} onChange={(e) => setLinkedInKey(e.target.value)} placeholder="SerpAPI key (optional)" className={`w-full px-4 py-2 rounded ${darkMode ? 'bg-white/5 border border-white/10' : 'bg-white border border-gray-300'}`} />
                                        <p className="text-xs mt-2 opacity-60">Get free at: <a href="https://serpapi.com" target="_blank" className="text-blue-400 underline">serpapi.com</a></p>
                                    </div>
                                </div>
                                
                                <div className={`rounded-xl p-6 border ${card}`}>
                                    <h2 className="text-xl font-bold mb-4">Clustering</h2>
                                    <select value={algorithm} onChange={(e) => setAlgorithm(e.target.value)} className={`w-full px-4 py-3 rounded-lg mb-3 ${darkMode ? 'bg-white/10 border border-white/20' : 'bg-white border border-gray-300'}`}>
                                        <option value="kmeans">K-Means</option>
                                        <option value="dbscan">DBSCAN</option>
                                        <option value="hierarchical">Hierarchical</option>
                                    </select>
                                    <label className="flex items-center gap-2">
                                        <input type="checkbox" checked={autoClusters} onChange={(e) => setAutoClusters(e.target.checked)} className="w-5 h-5" />
                                        Auto-detect optimal clusters
                                    </label>
                                </div>
                                
                                <div className="rounded-xl p-6 bg-gradient-to-br from-blue-500/20 to-cyan-500/20 border border-blue-400/30">
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <h3 className="font-bold text-lg mb-2">Ready to Fetch</h3>
                                            <div className="text-sm space-y-1">
                                                <div>📊 {topics.length} topics</div>
                                                <div>🔍 {Object.values(sources).filter(s => s.enabled).length} sources</div>
                                                <div>🎯 {topics.length * Object.values(sources).filter(s => s.enabled).reduce((a,s) => a + s.limit, 0)} items</div>
                                            </div>
                                        </div>
                                        <button onClick={startJob} disabled={isRunning || status !== 'connected'} className="px-8 py-4 bg-gradient-to-r from-blue-500 to-cyan-500 rounded-xl font-bold text-lg hover:scale-105 transition disabled:opacity-50 shadow-xl">
                                            {isRunning ? '⏳ Running...' : '▶️ Start'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {activeTab === 'progress' && (
                            <div className={`rounded-xl p-6 border ${card} fade-in`}>
                                <h2 className="text-xl font-bold mb-4">Activity Logs</h2>
                                <div className="space-y-2 max-h-96 overflow-y-auto">
                                    {logs.length === 0 ? (
                                        <p className="text-center py-8 text-gray-500">No logs yet</p>
                                    ) : (
                                        logs.slice().reverse().map((log, i) => (
                                            <div key={i} className={`p-3 rounded-lg ${log.type === 'error' ? 'bg-red-500/20 border-l-4 border-red-500' : log.type === 'success' ? 'bg-green-500/20 border-l-4 border-green-500' : 'bg-blue-500/20 border-l-4 border-blue-500'}`}>
                                                <div className="text-xs opacity-75">{log.timestamp}</div>
                                                <div>{log.message}</div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}
                        
                        {activeTab === 'results' && (
                            <div className="space-y-6 fade-in">
                                {results.length === 0 ? (
                                    <div className={`rounded-xl p-12 text-center border ${card}`}>
                                        <p className="text-lg">No results yet</p>
                                        <p className="text-sm text-gray-500 mt-2">Start fetching to see results here</p>
                                    </div>
                                ) : (
                                    results.map((r, i) => (
                                        <div key={i} className={`rounded-xl p-6 border ${card}`}>
                                            <h3 className="text-xl font-bold mb-4">{r.topic}</h3>
                                            <div className="grid grid-cols-3 gap-4">
                                                <div className="p-4 rounded-lg bg-blue-500/10">
                                                    <div className="text-sm text-gray-400">Total Items</div>
                                                    <div className="text-2xl font-bold">{r.items}</div>
                                                </div>
                                                <div className="p-4 rounded-lg bg-blue-500/10">
                                                    <div className="text-sm text-gray-400">Clusters</div>
                                                    <div className="text-2xl font-bold">{r.clusters}</div>
                                                </div>
                                                <div className="p-4 rounded-lg bg-blue-500/10">
                                                    <div className="text-sm text-gray-400">Sources</div>
                                                    <div className="text-2xl font-bold">{Object.values(sources).filter(s => s.enabled).length}</div>
                                                </div>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
